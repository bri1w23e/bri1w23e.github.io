<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Eaglercraft Launcher</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0b0e13;
        font-family: Arial, sans-serif;
        color: white;
    }

    .box {
        width: 320px;
        padding: 20px;
        background: #11141c;
        border-radius: 12px;
        text-align: center;
    }

    h1 {
        margin-bottom: 20px;
        font-size: 1.4rem;
    }

    a {
        display: block;
        padding: 14px;
        margin: 10px 0;
        background: #1a1d26;
        border-radius: 10px;
        font-size: 1.05rem;
        color: white;
        text-decoration: none;
        border: 1px solid #222;
        position: relative;
        overflow: hidden;
        transition: 0.25s;
    }

    /* ⚡ Lightning hover effect */
    a::before {
        content: "";
        position: absolute;
        top: -120%;
        left: 0;
        width: 100%;
        height: 300%;
        background: linear-gradient(120deg, transparent, rgba(0,170,255,0.6), transparent);
        transform: skewY(-12deg);
        opacity: 0;
        transition: 0.3s;
    }

    a:hover::before {
        top: -20%;
        opacity: 1;
    }

    a:hover {
        border-color: #00aaff;
        box-shadow: 0 0 15px rgba(0,170,255,0.4);
    }
</style>
</head>

<body>

<div class="box">
    <h1>Ports</h1>

    <a href="https://bri1w23e.github.io/" target="_blank" rel="noopener noreferrer">
        Coming Soon...
    </a>


    </a>
</div>

</body>
</html>
