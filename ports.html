<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MC to Eagler Ports</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0e13;
    font-family: Arial, sans-serif;
    color: white;
  }

  #glitchCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
  }

  /* 🟣 ORB THAT FOLLOWS CURSOR */
  #orb {
    position: fixed;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(140,0,255,0.6), rgba(0,0,0,0));
    pointer-events: none;
    filter: blur(25px);
    transform: translate(-50%, -50%);
    z-index: -1;
  }

  .box {
    width: 320px;
    padding: 20px;
    background: rgba(17, 20, 28, 0.85);
    border-radius: 12px;
    text-align: center;
    backdrop-filter: blur(4px);
  }

  h1 {
    margin-bottom: 20px;
    font-size: 1.4rem;
  }

  .btn {
    display: block;
    padding: 14px;
    margin: 10px 0;
    background: #181b27;
    border-radius: 10px;
    font-size: 1.05rem;
    color: white;
    text-decoration: none;
    border: 1px solid #262938;
    position: relative;
    overflow: hidden;
  }
</style>
</head>

<body>

<canvas id="glitchCanvas"></canvas>
<div id="orb"></div>

<div class="box">
  <h1>Ports Launcher</h1>

  <a class="btn" href="https://bri1w23e.github.io/" rel="noopener noreferrer">
    Coming Soon
  </a>

  <a class="btn" href="https://bri1w23e.github.io/" rel="noopener noreferrer">
    Back
  </a>
</div>
<script>
/* ============================
   🔥 GLITCH BACKGROUND (FIXED)
   ============================ */
const canvas = document.getElementById("glitchCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function glitchBackground() {
  ctx.fillStyle = "#0b0e13";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < 25; i++) {
    let w = Math.random() * 350;
    let h = Math.random() * 7 + 1;
    let x = Math.random() * canvas.width;
    let y = Math.random() * canvas.height;

    // Purple glitch streaks
    ctx.fillStyle = `rgba(180, 0, 255, ${Math.random()*0.35})`;
    ctx.fillRect(x, y, w, h);
  }

  requestAnimationFrame(glitchBackground);
}

glitchBackground();

/* ============================
   🟣 ORB FOLLOWING CURSOR
   ============================ */
const orb = document.getElementById("orb");

document.addEventListener("mousemove", (e) => {
  orb.style.left = e.clientX + "px";
  orb.style.top = e.clientY + "px";
});

/* ============================
   💥 BIG PURPLE EXPLOSION + NAVIGATION
   ============================ */
function explodeButton(btn, url) {
  const rect = btn.getBoundingClientRect();
  const particles = 35; // more particles

  for (let i = 0; i < particles; i++) {
    const p = document.createElement("div");
    p.style.position = "fixed";
    p.style.left = rect.left + rect.width / 2 + "px";
    p.style.top = rect.top + rect.height / 2 + "px";
    p.style.width = "10px";   // bigger particles
    p.style.height = "10px";
    p.style.background = "rgba(180, 0, 255, 0.9)"; // purple only
    p.style.borderRadius = "50%";
    p.style.pointerEvents = "none";
    p.style.zIndex = "9999";
    p.style.transition = "transform 0.7s ease-out, opacity 0.7s ease-out";

    document.body.appendChild(p);

    const angle = Math.random() * Math.PI * 2;
    const distance = 120 + Math.random() * 80; // bigger explosion

    setTimeout(() => {
      p.style.transform = `translate(${Math.cos(angle)*distance}px, ${Math.sin(angle)*distance}px)`;
      p.style.opacity = "0";
    }, 10);

    setTimeout(() => p.remove(), 800);
  }

  // Wait for explosion to finish, THEN navigate
  setTimeout(() => {
    window.location.href = url;
  }, 450);
}

document.querySelectorAll(".btn").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.preventDefault(); 
    explodeButton(btn, btn.href);
  });
});
</script>


</body>
</html>
